<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked by Focus Desk</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="blocked-shell">
    <header class="blocked-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Focus Desk</div>
      <time id="focusRemaining">--:--</time>
    </header>

    <section class="blocked-content">
      <div class="blocked-intro">
        <span class="index">01</span>
        <p class="eyebrow">Outside your focus workspace</p>
        <h1 id="blockedDomain">This site is blocked.</h1>
        <p id="blockedContext">Your focus session is protecting this time.</p>
      </div>

      <section id="gatePanel" class="gate-panel">
        <div id="gateContent"></div>
        <p id="gateError" class="gate-error" role="alert"></p>
      </section>

      <footer class="blocked-actions">
        <a href="newtab.html" class="button secondary">Return to dashboard</a>
        <span id="accessNote"></span>
      </footer>
    </section>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
