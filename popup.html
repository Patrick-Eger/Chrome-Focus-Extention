<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Desk</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header><span class="brand-mark" aria-hidden="true"></span><strong>Focus Desk</strong><span id="popupStatus">Ready</span></header>
    <section class="timer-section">
      <span class="eyebrow">Focus session</span>
      <div id="popupTimer">25:00</div>
      <select id="popupWorkspace" aria-label="Workspace"></select>
      <div class="segmented">
        <button data-minutes="25" class="active">25 min</button>
        <button data-minutes="90">90 min</button>
      </div>
      <button id="popupFocusToggle" class="primary-button">Start focus</button>
    </section>
    <section class="quick-actions">
      <button id="allowCurrentSite">Allow current site</button>
      <button id="favoriteCurrentSite">Favorite current site</button>
      <button id="captureCurrentSite">Save page to Inbox</button>
      <button id="openSidePanel">Open side panel</button>
      <button id="openDashboard">Open dashboard</button>
    </section>
    <p id="popupMessage" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
