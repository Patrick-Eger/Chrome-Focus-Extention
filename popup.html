<!DOCTYPE html>
<html>
<head>
  <title>Whitelist Manager</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; width: 350px; }
    h2 { margin-top: 0; }
    label { font-size: 1.1em; }
    select, input { padding: 5px; margin: 5px 0; }
    button { padding: 5px 8px; margin: 2px; }
    #addCurrent { width: 100%; background: #1976d2; color: white; border: none; }
    ul { list-style-type: none; padding: 0; max-height: 200px; overflow-y: auto; }
    li { margin: 8px 0; display: flex; justify-content: space-between; background: #f0f0f0; padding: 5px; border-radius: 4px; }
    .remove { color: red; cursor: pointer; font-weight: bold; }
    #listActions { margin: 10px 0; }
    #timerInput { width: 50px; }
  </style>
</head>
<body>
  <h2>Whitelist Blocker</h2>
  <label>
    <input type="checkbox" id="enableToggle"> Enable Blocking
  </label>
  <span> for <input type="number" id="timerInput" min="0" value="0"> minutes (0 = unlimited)</span>
  <hr>
  <div id="listSelector">
    <label>Active List:</label>
    <select id="activeListSelect"></select>
  </div>
  <div id="listActions">
    <input type="text" id="newListName" placeholder="New list name">
    <button id="createList">Create</button>
    <button id="renameList">Rename</button>
    <button id="deleteList">Delete</button>
  </div>
  <hr>
  <button id="addCurrent">Add Current Site's Domain</button>
  <div>
    <input type="text" id="siteInput" placeholder="e.g., youtube.com">
    <button id="addButton">Add</button>
  </div>
  <ul id="whitelistList"></ul>
  <script src="popup.js"></script>
</body>
</html>
